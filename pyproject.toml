[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-bulk-downloader"
version = "0.1.0"
description = "Bulk download a list of mod files from nexusmods.com using their API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31,<3",
    "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-requests",
]

[project.scripts]
nexus-bulk-download = "nexus_downloader.cli:main"

[tool.setuptools.packages.find]
include = ["nexus_downloader*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
